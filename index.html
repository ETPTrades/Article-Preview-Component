<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="script.js"></script>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Article preview component</title>
  </head>
  <body>
    <section>
      <img
        src="./images/drawers.jpg"
        alt="picture of a small green dressser with weat plants in a beige colored vase."
      />
      <article>
        <p>
          Shift the overall look and feel by adding these wonderful touches to
          furniture in your home
        </p>
        <p>
          Ever been in a room and felt like something was missing? Perhaps it
          felt slightly bare and uninviting. I’ve got some simple tips to help
          you make any room feel complete.
        </p>
      </article>
      <footer>
        <div class="footer__second-wrap">
          <img
            src="./images/avatar-michelle.jpg"
            alt="A professional picture of Michelle Appleton"
            class="michelle"
          />
          <div class="footer__para-wrap">
            <span>Michelle Appleton</span>
            <span>20 Jun 2020</span>
          </div>
        </div>
        <div class="footer__hidden-wrap">
          <span class="footer__share-text"></span>
          <!--(share)this text will be dynamically added-->
          <ul>
            <li>
              <a href="#"
                ><img
                  src="./images/icon-facebook.svg"
                  alt="facebook icon"
                  class="social-icon"
              /></a>
            </li>
            <li>
              <a href="#"
                ><img
                  src="./images/icon-twitter.svg"
                  alt="twitter icon"
                  class="social-icon"
              /></a>
            </li>
            <li>
              <a href="#"
                ><img
                  src="./images/icon-pinterest.svg"
                  alt="pinterest icon"
                  class="social-icon"
              /></a>
            </li>
          </ul>
        </div>
        <img src="./images/icon-share.svg" alt="" class="share" />
      </footer>
    </section>

    <!-- <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Gyasi Thomas</a>.
    </footer> -->
  </body>
</html>
