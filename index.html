<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="script.js"></script>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Article preview component</title>
  </head>
  <body>
    <div class="article-card">
      <img
        src="./images/drawers.jpg"
        alt="picture of a small green dressser with weat plants in a beige colored vase."
      />
      <article>
        <p class="dark-text">
          Shift the overall look and feel by adding these wonderful touches to
          furniture in your home
        </p>
        <p class="light-text">
          Ever been in a room and felt like something was missing? Perhaps it
          felt slightly bare and uninviting. I’ve got some simple tips to help
          you make any room feel complete.
        </p>
        <div class="contact">
          <div class="contact__second-wrap">
            <img
              src="./images/avatar-michelle.jpg"
              alt="A professional picture of Michelle Appleton"
              class="michelle"
            />
            <div class="contact__para-wrap">
              <span>Michelle Appleton</span>
              <span class="light-text">20 Jun 2020</span>
            </div>
          </div>
          <div class="contact__hidden-wrap">
            <span class="contact__share-text light-text">SHARE</span>
            <ul>
              <li>
                <a href="#"
                  ><img
                    src="./images/icon-facebook.svg"
                    alt="facebook icon"
                    class="social-icon"
                /></a>
              </li>
              <li>
                <a href="#"
                  ><img
                    src="./images/icon-twitter.svg"
                    alt="twitter icon"
                    class="social-icon"
                /></a>
              </li>
              <li>
                <a href="#"
                  ><img
                    src="./images/icon-pinterest.svg"
                    alt="pinterest icon"
                    class="social-icon"
                /></a>
              </li>
            </ul>
          </div>
          <button>
            <img src="./images/icon-share.svg" alt="" class="share" />
          </button>
        </div>
      </article>
    </div>
  </body>
</html>
